<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseChain TA Setup Analyzer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>PulseChain TA Setup Analyzer</h1>
    <p>Technical analysis toolkit to find setups on PulseChain tokens.</p>
  </header>

  <main>
    <div class="controls">
      <input type="text" id="token" value="pulsechain" placeholder="CoinGecko Token ID...">
      <button onclick="loadSingle()">Load</button>
      <button onclick="toggleScanner()">Scan Top 10</button>
      <button onclick="connectWallet()">Connect MetaMask</button>
    </div>

    <canvas id="chart"></canvas>
    <div id="alerts"></div>
    <div id="dex-info"></div>

    <section id="scanner-section" class="hidden">
      <h2>Top 10 Scanner</h2>
      <table id="scanner-table">
        <thead>
          <tr>
            <th>Token</th>
            <th>Price</th>
            <th>RSI (14d)</th>
            <th>Setup</th>
            <th>Liquidity</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <footer>
    <button onclick="exportSetup()">Export Setup (JSON)</button>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/technicalindicators@3.1.0/dist/browser.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-trendline@2.0.1/src/chartjs-plugin-trendline.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
